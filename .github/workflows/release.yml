name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HERMES_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::HERMES_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          HERMES_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.HERMES_KEYSTORE_PASSWORD }}
          # A tag v1.2.3 becomes versionName 1.2.3; manual runs are labelled by commit.
          HERMES_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.sha) }}
          HERMES_VERSION_CODE: ${{ github.run_number }}
        run: |
          export HERMES_VERSION_NAME="${HERMES_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "hermes-mobile-$HERMES_VERSION_NAME.apk"
          echo "APK=hermes-mobile-$HERMES_VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Package the Mac side
        run: |
          mkdir -p dist/hermes-mobile-mac
          cp -R mac/. dist/hermes-mobile-mac/
          tar -czf hermes-mobile-mac.tar.gz -C dist hermes-mobile-mac

      - uses: actions/upload-artifact@v6
        with:
          name: hermes-mobile-release
          path: |
            ${{ env.APK }}
            hermes-mobile-mac.tar.gz
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" hermes-mobile-mac.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
